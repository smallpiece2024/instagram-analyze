# 収集ワーカー（R2 設計 5.1 章、5.8 章）。
# - 起動は Supabase の pg_cron が毎時 17 分（UTC）に workflow_dispatch で行う（supabase/migrations/20261003000000_r2_collect_dispatch.sql）。
#   GitHub の schedule は 2026-10-02 に約 33 回中 1 回しか動かなかったので使わない。
# - run_daily=true の回（pg_cron が UTC 20 時台 = JST 05 時台に付ける）だけ run-daily → run-hourly。ほかは run-hourly。
#   ただし 05 時台の回が動かなかった日の補いとして、前回の account-daily の成功から 24 時間を過ぎていれば、ほかの回でも run-daily を行う（daily-due）。
# - 最後に check-alerts（人が見るべき状態なら終了コード 1 → GitHub の失敗メール）と死活監視への ping。
# - 秘密（Secrets）は必要なステップの env にだけ渡す。Variables はログでマスクされないので公開してよい値だけ置く。
# - アクションはコミット SHA で固定する（横に版）。更新は dependabot（.github/dependabot.yml）。
name: collect

on:
  # schedule は付けない（上の理由）。pg_cron と手動の両方がこの入口を使う
  workflow_dispatch:
    inputs:
      simulate_alert:
        description: '収集を飛ばし、check-alerts だけを alert=simulated で失敗させる（通知の経路の確認）'
        type: boolean
        default: false
      run_daily:
        description: 'この実行で run-daily も行う（pg_cron は JST 05 時台の回に付ける。手動では取りこぼしの補い用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-analyze-collect
  cancel-in-progress: false

jobs:
  collect:
    # repo Variable COLLECT_ENABLED=true のときだけ動く（Secrets を登録する前や、ローカルへ戻すときは false にする。R2 設計 7.3 章）
    if: ${{ vars.COLLECT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets は GitHub の Environment「Production」に置いている（Repository secrets ではない）。承認者は付けず、起動できるブランチを main に限る（R2 設計 5.8 章）
    environment: Production
    permissions:
      contents: read
    env:
      WORKER_LOG_LEVEL: info
      # 通知の経路の確認（R2 設計 5.2 章）。dispatch の入力か repo Variable（pg_cron は simulate_alert を送らないので Variable だけが効く）。
      # 1 か所で評価し、収集を飛ばす判定（daily、hourly）と check-alerts の両方で参照する
      SIMULATE: ${{ inputs.simulate_alert == true || vars.WORKER_SIMULATE_ALERT == 'true' }}
    steps:
      # daily（token-check → profile-daily → account-daily → media-sync --full）を含める回か。
      # 決めるのは起動側（pg_cron が起動時の UTC の時で決める）。キューで待って時がずれても判定は変わらない
      - id: slot
        name: decide daily slot
        run: |
          daily=false
          if [ "$RUN_DAILY" = "true" ]; then daily=true; fi
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "utc_hour=$(date -u +%H) daily=$daily"
        env:
          RUN_DAILY: ${{ inputs.run_daily || 'false' }}

      # 接続エラーの文言にホスト名・ユーザー名・project ref が混じっても公開ログに出ないよう、部分文字列としてマスクする
      # （setup-node より前なので node に頼らず sed で切り出す。パスワードは URL エンコード済みの前提）
      - name: mask db host, user, project ref
        run: |
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-z]+://([^@/]*@)?([^:/?]+).*#\2#')
          user=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-z]+://([^:@/]+)(:[^@/]*)?@.*#\1#')
          ref=${user#postgres.}
          api_host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^[a-z]+://([^:/?]+).*#\1#')
          [ -n "$host" ] && echo "::add-mask::$host"
          [ -n "$user" ] && echo "::add-mask::$user"
          [ -n "$ref" ] && [ "$ref" != "$user" ] && echo "::add-mask::$ref"
          [ -n "$api_host" ] && echo "::add-mask::$api_host"
          true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --workspace worker --ignore-scripts
      - run: npm run build --workspace worker

      # ffmpeg と ffprobe は、BtbN/FFmpeg-Builds の静的ビルド（月末の版。月末の版は長く残る）を版と SHA-256 で固定し、
      # Actions のキャッシュに置いて使う。Ubuntu のミラーからの apt-get は遅いことがあり、
      # 5 分の上限に当たって video_analysis が「ffmpeg がない」で失敗していた（2026-10-07〜08 に約 30 回中 3 回）。
      # 入らなくても収集は進める（stories と video_analysis の動画解析だけ failed になり、メールで分かる）
      - id: ffmpeg-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-7d6d93e9c39e0e461feb13c118e91e4eec2515e4da3a01d4ad6790996731bbee
      - name: ffmpeg
        id: ffmpeg
        continue-on-error: true
        timeout-minutes: 5
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-lgpl-8.1.tar.xz
          FFMPEG_SHA256: 7d6d93e9c39e0e461feb13c118e91e4eec2515e4da3a01d4ad6790996731bbee
          CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: |
          dir="$HOME/ffmpeg-bin"
          if [ "$CACHE_HIT" != "true" ] || [ ! -x "$dir/ffmpeg" ] || [ ! -x "$dir/ffprobe" ]; then
            rm -rf "$dir" && mkdir -p "$dir"
            curl -fsSL --retry 3 --max-time 120 -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
            tar -xJf /tmp/ffmpeg.tar.xz -C "$dir" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            rm -f /tmp/ffmpeg.tar.xz
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | head -n 1
      # ジョブの最後ではなく、入れた直後に保存する（収集が失敗した回でも保存されるように）
      - if: ${{ steps.ffmpeg.outputs.downloaded == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-7d6d93e9c39e0e461feb13c118e91e4eec2515e4da3a01d4ad6790996731bbee

      # 05 時台の回が GitHub の側で動かなかった日の補い（2026-10-06 にランナーが割り当てられず取り消された）。
      # 標準出力は due=true|false の 1 行だけ（ログは標準エラー）。DB を読めなくても毎時の収集は止めない
      - id: due
        if: ${{ steps.slot.outputs.daily != 'true' && env.SIMULATE != 'true' }}
        continue-on-error: true
        run: node apps/worker/dist/index.js daily-due >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ vars.DATABASE_SSL_CA }}

      - id: daily
        if: ${{ (steps.slot.outputs.daily == 'true' || steps.due.outputs.due == 'true') && env.SIMULATE != 'true' }}
        run: node apps/worker/dist/index.js run-daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ vars.DATABASE_SSL_CA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_GRAPH_API_VERSION: v25.0
          WORKER_BACKFILL_HISTORY_DAYS: '400'

      - id: hourly
        if: ${{ !cancelled() && env.SIMULATE != 'true' }}
        run: node apps/worker/dist/index.js run-hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ vars.DATABASE_SSL_CA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_GRAPH_API_VERSION: v25.0
          WORKER_BACKFILL_HISTORY_DAYS: '400'

      # 収集が失敗しても判定は行う（cancelled のときだけ飛ばす）。該当があれば終了コード 1 でこのジョブが失敗になる
      - id: alerts
        if: ${{ !cancelled() }}
        run: node apps/worker/dist/index.js check-alerts --scope ${{ (steps.slot.outputs.daily == 'true' || steps.due.outputs.due == 'true') && 'daily' || 'hourly' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA: ${{ vars.DATABASE_SSL_CA }}
          WORKER_SIMULATE_ALERT: ${{ env.SIMULATE }}

      # 走ったことだけを知らせる（成否は GitHub のメールが担う。R2 設計 5.3 章、5.5 章）
      - name: ping
        if: ${{ !cancelled() }}
        run: curl -fsS --max-time 10 --retry 3 "$HEALTHCHECKS_PING_URL" > /dev/null
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}

# keepalive ジョブ（60 日間活動がないとスケジュールが無効になる対策）は、schedule をやめたので外した（R2 設計 5.4 章、5.8 章）
